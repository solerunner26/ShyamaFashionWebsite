<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Seamless iOS Safari & Standalone WebApp Status Bar Integration -->
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SHYAMA" />
    <meta name="format-detection" content="telephone=no" />

    <meta
      name="description"
      content="Shyama — Breathable linen palazzos, pure mulmul lounge pajamas, tailored trousers & handcrafted kurtis tailored in Surat."
    />

    <!-- WhatsApp / iMessage Rich Link Preview for Client Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SHYAMA — Surat Atelier · Women’s Wardrobe" />
    <meta
      property="og:description"
      content="Fluid linen palazzos, pure mulmul lounge pajamas & tailored everyday trousers crafted in Surat."
    />
    <meta property="og:image" content="/editorial/hero-atelier.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icons & PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>SHYAMA — Tailored Women’s Bottomwear &amp; Everyday Silhouettes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
